# zizmor configuration file
# Ref: https://docs.zizmor.sh/configuration/

rules:
  # Disable rules that are noisy or expected in this repository
  dangerous-triggers:
    disable: true
  cache-poisoning:
    disable: true
  excessive-permissions:
    disable: true
  artipacked:
    disable: true
  dependabot-cooldown:
    disable: true
